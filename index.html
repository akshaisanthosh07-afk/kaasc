<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e0f2fe" />
  <title>Welcome</title>
  <meta name="description" content="Official membership portal." />
  <link rel="icon" href="kassclogo-web.png" />
  <link rel="preload" as="image" href="bg.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="welcome photo-bg">
    <section class="welcome-hero">
      <img class="club-logo" src="kassclogo-web.png" alt="Club logo" width="150" height="217" />
      <div class="welcome-text">
        <h1 class="club-title">
          <span class="title-pre">Welcome to</span>
          <span class="title-main" id="titleMain">KAASC</span>
          <span class="title-sub"><span id="titleSub">Keezhillam</span></span>
        </h1>
        <p class="welcome-sub" data-club-tagline>Join our community of members</p>
      </div>
    </section>

    <nav class="welcome-actions" aria-label="Choose an option">
      <a class="btn btn-primary btn-xl" href="register.html">
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>
        </span>
        <span>Member Registration</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="btn btn-light btn-xl" href="admin.html">
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </span>
        <span>Admin Login</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </nav>

    <p class="welcome-foot">© <span id="year"></span> <span data-club-name>KAASC Keezhillam</span></p>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    applyBranding();
    // "KAASC Keezhillam" -> big "KAASC" + spaced-out "KEEZHILLAM" underneath
    const [mainName, ...restName] = CONFIG.CLUB_NAME.trim().split(/\s+/);
    document.getElementById("titleMain").textContent = mainName;
    const subEl = document.getElementById("titleSub");
    if (restName.length) subEl.textContent = restName.join(" ");
    else subEl.parentElement.hidden = true;
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
